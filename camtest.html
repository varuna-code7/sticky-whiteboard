<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Camera and mic test</title>
  <style>
    body { font: 16px/1.5 Arial, sans-serif; max-width: 640px; margin: 30px auto; padding: 0 16px; }
    button { font-size: 16px; padding: 10px 18px; cursor: pointer; }
    pre { background: #f4f1ea; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
    video { width: 320px; background: #000; border-radius: 8px; display: block; margin-top: 12px; }
  </style>
</head>
<body>
  <h2>Camera and microphone test</h2>
  <p>This page checks if your browser lets this site use the camera and mic, separate from the whiteboard.</p>
  <button id="go">Test camera and mic</button>
  <pre id="out">Click the button above.</pre>
  <video id="v" autoplay playsinline muted></video>

  <script>
    const out = document.getElementById('out');
    const video = document.getElementById('v');
    let lines = [];
    function log(text) { lines.push(text); out.textContent = lines.join('\n'); }

    function hint(err) {
      if (err.name === 'NotAllowedError') return 'BLOCKED. Click the camera/lock icon at the left of the address bar, set Camera and Microphone to Allow, then reload this page.';
      if (err.name === 'NotFoundError') return 'No camera or microphone was found on this computer.';
      if (err.name === 'NotReadableError') return 'The device is busy. Close other apps or tabs that use the camera (Zoom, Teams, another tab).';
      return 'Unknown problem.';
    }

    document.getElementById('go').onclick = async () => {
      lines = [];
      log('Address: ' + location.href);
      log('Secure context: ' + window.isSecureContext);
      const hasApi = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
      log('Camera/mic feature available: ' + hasApi);
      if (!hasApi) {
        log('RESULT: this address does not allow camera or mic. Open http://127.0.0.1:5000/camtest.html in Chrome or Edge.');
        return;
      }

      for (const name of ['camera', 'microphone']) {
        try {
          const state = await navigator.permissions.query({ name });
          log(name + ' permission: ' + state.state);
        } catch (e) {
          log(name + ' permission: unknown');
        }
      }

      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        log('Cameras found: ' + devices.filter(d => d.kind === 'videoinput').length +
            ', microphones found: ' + devices.filter(d => d.kind === 'audioinput').length);
      } catch (e) { /* ignore */ }

      log('Asking for camera + mic... look for a permission box near the address bar and click Allow.');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        log('RESULT: SUCCESS. Camera and mic both work in this browser.');
        video.srcObject = stream;
      } catch (e) {
        log('Camera + mic failed: ' + e.name + ' (' + e.message + ')');
        log('Meaning: ' + hint(e));
        try {
          const audioOnly = await navigator.mediaDevices.getUserMedia({ audio: true });
          log('RESULT: the MICROPHONE works, but the camera does not (see above).');
          audioOnly.getTracks().forEach(t => t.stop());
        } catch (e2) {
          log('Microphone-only also failed: ' + e2.name + ' (' + e2.message + ')');
          log('RESULT: this browser cannot use your microphone either. ' + hint(e2));
        }
      }
    };
  </script>
</body>
</html>
